name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      upgrade_runtime:
        description: "给独立升级 Worker 配置现有密钥（不会切换域名或迁移数据）"
        type: choice
        default: none
        options:
          - none
          - preview
          - production

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.upgrade_runtime == 'none'
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Lint Check
        run: bun lint

      - name: Compile Paraglide Runtime
        run: bun run i18n:compile

      - name: Translation Check
        run: bun run i18n:verify && bun run i18n:prune-unused --check

      - name: Type Check
        run: bun typecheck

      # Same command Workers Builds runs to deploy, so a broken build fails here first.
      - name: Build
        run: bun run build

      - name: Run Node Tests
        run: bun run test:node

      - name: Run Integration Tests
        run: bun run test

  upgrade-runtime:
    name: Configure isolated upgrade Worker
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_runtime != 'none' && github.repository == 'yasingf/flare-stack-blog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Configure runtime without exposing secret values
        run: bun scripts/sync-upgrade-runtime.ts
        env:
          UPGRADE_RUNTIME_MODE: ${{ inputs.upgrade_runtime }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DOMAIN: ${{ secrets.DOMAIN }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          UMAMI_SRC: ${{ secrets.UMAMI_SRC }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
          UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
